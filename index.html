<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Windows Games</title>
<style>
:root{--bl:#0078d7;--win:#fff;--tx:#1b1b1b;--bar:#e6e6e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--win:#202020;--tx:#f0f0f0;--bar:#2d2d2d}}
:root[data-theme="dark"]{--win:#202020;--tx:#f0f0f0;--bar:#2d2d2d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bl);font-family:"Segoe UI",system-ui,Arial,sans-serif;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.scr{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.hide{display:none!important}
#bsod{background:var(--bl);color:#fff;display:flex;flex-direction:column;justify-content:center;gap:2.2vmin;padding:6vmin 8vmin}
.face{font-size:clamp(70px,18vmin,170px);line-height:1}
#bsod p{margin:0;font-size:clamp(16px,3.2vmin,28px);max-width:780px}
#pg{font-size:clamp(16px,3.2vmin,28px)}
.row{display:flex;gap:16px;align-items:center;font-size:13px;flex-wrap:wrap}
#qr{width:84px;height:84px}
.btn{font:600 22px "Segoe UI",system-ui,sans-serif;padding:10px 40px;background:#fff;color:var(--bl);border:2px solid #fff;cursor:pointer;align-self:flex-start}
.btn:hover,.btn:active{background:transparent;color:#fff}
.row2{display:flex;gap:12px;flex-wrap:wrap}
.btn.alt{background:transparent;color:#fff}
.btn.alt:hover,.btn.alt:active{background:#fff;color:var(--bl)}
.wsp{position:relative;width:48px;height:48px}
.wsp i{position:absolute;inset:0;opacity:0;animation:ws 2.4s cubic-bezier(.3,.6,.5,.9) infinite}
.wsp i::before{content:"";position:absolute;left:50%;top:0;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#fff}
.wsp i:nth-child(2){animation-delay:.12s}.wsp i:nth-child(3){animation-delay:.24s}.wsp i:nth-child(4){animation-delay:.36s}.wsp i:nth-child(5){animation-delay:.48s}
@keyframes ws{0%{transform:rotate(-30deg);opacity:0}8%{opacity:1}65%{transform:rotate(330deg);opacity:1}75%,100%{transform:rotate(390deg);opacity:0}}
#rk{background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center;padding:0 6vmin}
#rkt{font-size:clamp(20px,4vmin,34px);font-weight:300}
#rk .btn{position:absolute;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);font-size:14px;padding:6px 18px;opacity:.6}
#rep,#mode,#opt{background:#0b63ad;color:#fff;display:flex;flex-direction:column;justify-content:center;gap:2.4vmin;padding:6vmin 8vmin}
#rep h1,#mode h1,#opt h1{margin:0;font-weight:300;font-size:clamp(26px,6vmin,48px)}
#rep p,#mode p{margin:0;font-size:clamp(16px,3vmin,24px)}
.rt{display:flex;flex-direction:column;gap:6px;max-width:560px;margin:2vmin 0}
.rt button{background:rgba(255,255,255,.15);border:2px solid transparent;color:#fff;text-align:left;padding:12px 16px;cursor:pointer;font-family:inherit}
.rt button:hover,.rt button:active{border-color:#fff;background:rgba(255,255,255,.25)}
.rt b{display:block;font-size:clamp(18px,3.2vmin,24px);font-weight:400}
.rt span{font-size:clamp(13px,2.2vmin,16px);opacity:.85}
.sx{display:none}
body.serious .sx{display:block}
body.serious #play,body.serious #plat{display:none}
.eye{display:inline-block;position:relative;width:22px;height:12px;border:2px solid currentColor;border-radius:50%;vertical-align:middle;margin-right:8px}
.eye::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;background:currentColor;border-radius:50%}
#pk{position:absolute;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);font-size:14px;padding:8px 16px}
#os,#cor{background:#000}
#ocv,#ccv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#osh,#corh{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;max-width:70%;color:#fff;background:rgba(0,0,0,.55);padding:6px 10px;font-size:13px;pointer-events:none}
#osv,#corv{position:absolute;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);font-size:14px;padding:6px 18px}
.gl{display:inline-block;width:8px;height:8px;margin:0 30px 0 0;vertical-align:middle;background:currentColor;box-shadow:10px -5px currentColor,20px 4px currentColor}
#pk2{position:absolute;left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);font-size:14px;padding:8px 16px}
@media(max-width:620px){#pk2{left:auto;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 62px)}}
#corm{position:absolute;top:calc(env(safe-area-inset-top,0px) + 54px);right:10px;width:120px;height:8px;background:rgba(255,255,255,.25)}
#corm i{display:block;height:100%;width:0}
#crash{background:#000;color:#ddd;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;font-family:Consolas,"Courier New",monospace}
#crt{margin:0;font-size:clamp(14px,3.4vmin,26px);text-align:center;white-space:pre-wrap;word-break:break-all;max-width:90vw}
#crb{display:flex;gap:12px}
#crb .btn{font-size:14px;padding:8px 20px}
#dv{margin:2vmin 6vmin 5vmin}
#lg{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;z-index:5;font:14px "Segoe UI",sans-serif;padding:6px;background:#fff;color:#111;border:2px solid #fff}
#desk{background:linear-gradient(135deg,#0a3d91,#0078d7 55%,#00b4ff);color:#fff;display:flex;flex-direction:column}
#desk h2{font-weight:300;font-size:clamp(22px,5vmin,40px);margin:0;padding:7vmin 6vmin 2vmin}
#tiles{flex:1;display:flex;flex-wrap:wrap;gap:12px;padding:0 6vmin;align-content:flex-start;overflow-y:auto}
.tile{width:min(26vw,160px);height:min(26vw,160px);border:0;color:#fff;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:12px;font:600 15px "Segoe UI",sans-serif;text-align:left}
.tile:hover{outline:3px solid rgba(255,255,255,.7)}
.ic{display:block;position:relative;width:62px;height:62px}
.ic::before,.ic::after{content:"";position:absolute}
.ic.dash{transform:rotate(-12deg)}
.ic.dash::before{left:0;top:0;width:28px;height:28px;background:#f25022;box-shadow:33px 0 #7fba00,0 33px #00a4ef,33px 33px #ffb900}
.ic.flap::before{inset:0;background:#fff;clip-path:polygon(15% 0,15% 85%,35% 66%,52% 100%,68% 92%,52% 58%,80% 58%)}
.ic.flap{filter:drop-shadow(0 0 1px #000)}
.ic.ping::before{left:0;top:6px;width:8px;height:34px;background:#fff;box-shadow:46px 20px #fff}
.ic.ping::after{left:26px;top:28px;width:10px;height:10px;background:#ffb900;border-radius:50%}
.ic.brk::before{left:0;top:0;width:18px;height:10px;background:#f25022;box-shadow:22px 0 #ffb900,44px 0 #7fba00,0 14px #00a4ef,22px 14px #fff,44px 14px #f25022}
.ic.brk::after{left:10px;top:52px;width:42px;height:8px;background:#fff}
.ic.inv::before{left:11px;top:10px;width:40px;height:22px;background:#7fba00;border-radius:7px 7px 0 0;box-shadow:4px 22px 0 -4px #7fba00,32px 22px 0 -4px #7fba00}
.ic.inv::after{left:19px;top:17px;width:7px;height:7px;background:#000;box-shadow:16px 0 #000}
.ic.stk::before{left:10px;top:46px;width:40px;height:12px;background:#00a4ef;box-shadow:6px -14px #7fba00,-2px -28px #ffb900,10px -42px #f25022}
#win,#cv{touch-action:none}
.ic.snake::before{left:0;top:0;width:14px;height:14px;background:#fff;box-shadow:16px 0 #00b4ff,32px 0 #00b4ff,32px 16px #00b4ff,32px 32px #00b4ff,16px 32px #00b4ff,48px 48px #ffb900}
#gw{background:rgba(0,0,0,.5);z-index:10;display:flex;align-items:center;justify-content:center}
#win{width:min(700px,96vw);background:var(--win);color:var(--tx);border:1px solid var(--bl);box-shadow:0 10px 40px rgba(0,0,0,.5)}
.tt{display:flex;justify-content:space-between;align-items:center;background:var(--bl);color:#fff;padding-left:10px;font-size:14px}
#x{position:relative;width:46px;height:32px;border:0;background:transparent;cursor:pointer}
#x::before,#x::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:2px;background:#fff;margin:-1px 0 0 -7px;transform:rotate(45deg)}
#x::after{transform:rotate(-45deg)}
#x:hover{background:#e81123}
.cw{position:relative}
#cv{display:block;width:100%;aspect-ratio:16/9;background:#000}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}
.dlg{background:var(--win);color:var(--tx);padding:18px 22px;text-align:center;border:1px solid var(--bl);max-width:90%}
.dlg b{display:block;font-size:18px;margin-bottom:6px}
.dlg .btn{background:var(--bl);color:#fff;border-color:var(--bl);font-size:16px;padding:8px 28px;margin-top:12px;align-self:auto}
#hint{padding:8px 12px;font-size:13px;background:var(--bar);text-align:center}
#dp{display:grid;grid-template-columns:repeat(3,56px);gap:6px;justify-content:center;padding:10px}
#dp button{position:relative;height:56px;border:1px solid var(--bl);background:var(--bar);color:var(--tx)}
#dp button::before{content:"";position:absolute;left:50%;top:50%;border:0 solid transparent}
#dp .u::before{border-width:0 10px 16px;border-bottom-color:currentColor;margin:-8px 0 0 -10px}
#dp .d::before{border-width:16px 10px 0;border-top-color:currentColor;margin:-8px 0 0 -10px}
#dp .l::before{border-width:10px 16px 10px 0;border-right-color:currentColor;margin:-10px 0 0 -8px}
#dp .r::before{border-width:10px 0 10px 16px;border-left-color:currentColor;margin:-10px 0 0 -8px}
body.mobile #win{width:100vw;border:0}
body.mobile .btn{padding:14px 48px}
</style></head><body>

(function(){const q=$('#qr'),x=q.getContext('2d'),n=21,s=4;q.width=q.height=n*s;x.fillStyle='#fff';x.fillRect(0,0,n*s,n*s);x.fillStyle='#0078d7';
 for(let i=0;i<n;i++)for(let j=0;j<n;j++){if((i<8&&j<8)||(i>12&&j<8)||(i<8&&j>12))continue;if(Math.random()<.5)x.fillRect(i*s,j*s,s,s)}
 [[0,0],[14,0],[0,14]].forEach(([a,b])=>{x.fillStyle='#0078d7';x.fillRect(a*s,b*s,7*s,7*s);x.fillStyle='#fff';x.fillRect((a+1)*s,(b+1)*s,5*s,5*s);x.fillStyle='#0078d7';x.fillRect((a+2)*s,(b+2)*s,3*s,3*s)})})();

// ---------- Juegos ----------
function Dash(){let y=300,vy=0,rot=0,dist=0,sp=320,ob=[],nx=600;
 const o={score:0,dead:false,
 tap(){if(y>=300)vy=-640},
 u(dt){sp=Math.min(560,320+dist/40);dist+=sp*dt;o.score=Math.floor(dist/10);
  vy+=1900*dt;y+=vy*dt;if(y>=300){y=300;vy=0;rot=Math.round(rot/(Math.PI/2))*(Math.PI/2)}else rot+=dt*7;
  while(nx<dist+W+60){const n=1+(Math.random()*3|0);ob.push({x:nx,n});nx+=n*30+360+Math.random()*220+sp*.15}
  ob=ob.filter(b=>b.x+90-dist>-10);
  for(const b of ob)for(let i=0;i<b.n;i++){const sx=b.x+i*30-dist;
   if(94<sx+21&&122>sx+9&&y-4>282&&y-32<300)o.dead=true}},
 d(){const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a2a6b');g.addColorStop(1,'#0078d7');c.fillStyle=g;c.fillRect(0,0,W,H);
  c.strokeStyle='rgba(255,255,255,.12)';for(let x=-(dist*.5%80);x<W;x+=80){c.beginPath();c.moveTo(x,0);c.lineTo(x,300);c.stroke()}
  c.fillStyle='#111';c.fillRect(0,300,W,60);c.fillStyle='#00b4ff';c.fillRect(0,300,W,3);
  c.fillStyle='#ff3b30';for(const b of ob)for(let i=0;i<b.n;i++){const sx=b.x+i*30-dist;c.beginPath();c.moveTo(sx,300);c.lineTo(sx+15,270);c.lineTo(sx+30,300);c.fill()}
  c.save();c.translate(108,y-18);c.rotate(rot);const cl=['#f25022','#7fba00','#00a4ef','#ffb900'];
  for(let i=0;i<4;i++){c.fillStyle=cl[i];c.fillRect(-17+(i%2)*18,-17+(i>>1)*18,16,16)}c.restore()}};
 return o}

function Flap(){let y=170,vy=0,t=1.2,ps=[];
 const o={score:0,dead:false,
 tap(){vy=-420},
 u(dt){vy+=1500*dt;y+=vy*dt;t+=dt;
  if(t>1.5){t=0;ps.push({x:W,gy:40+Math.random()*120,p:false})}
  for(const p of ps){p.x-=170*dt;if(!p.p&&p.x+56<140){p.p=true;o.score++}
   if(152>p.x&&128<p.x+56&&(y-11<p.gy||y+11>p.gy+140))o.dead=true}
  ps=ps.filter(p=>p.x>-60);if(y<11||y>329)o.dead=true},
 d(){c.fillStyle='#4aa8ff';c.fillRect(0,0,W,H);c.fillStyle='rgba(255,255,255,.5)';c.fillRect(60,50,90,18);c.fillRect(380,90,120,18);
  for(const p of ps){c.fillStyle='#d0d7de';c.fillRect(p.x,0,56,p.gy);c.fillRect(p.x,p.gy+140,56,340-p.gy-140);
   c.fillStyle='#0078d7';c.fillRect(p.x,p.gy-18,56,18);c.fillRect(p.x,p.gy+140,56,18);
   c.strokeStyle='#fff';c.lineWidth=2;[p.gy-9,p.gy+149].forEach(q=>{c.beginPath();c.moveTo(p.x+38,q-4);c.lineTo(p.x+46,q+4);c.moveTo(p.x+46,q-4);c.lineTo(p.x+38,q+4);c.stroke()})}
  c.fillStyle='#111';c.fillRect(0,340,W,20);c.fillStyle='#0078d7';c.fillRect(0,340,28,20);
  c.save();c.translate(140,y);c.rotate(Math.max(-.5,Math.min(.9,vy/600)));c.scale(1.3,1.3);c.fillStyle='#fff';c.strokeStyle='#000';c.lineWidth=1.5;
  c.beginPath();c.moveTo(-8,-12);c.lineTo(-8,10);c.lineTo(-3,5);c.lineTo(2,14);c.lineTo(6,12);c.lineTo(1,3);c.lineTo(8,3);c.closePath();c.fill();c.stroke();c.restore()}};
 return o}

function Snake(){const cs=20,cols=32,rows=18;let s=[{x:10,y:9},{x:9,y:9},{x:8,y:9}],d={x:1,y:0},nd=d,acc=0,f;
 const nf=()=>{do f={x:Math.random()*cols|0,y:Math.random()*rows|0};while(s.some(p=>p.x===f.x&&p.y===f.y))};nf();
 const o={score:0,dead:false,
 dir(x,y){if(!(x===-d.x&&y===-d.y))nd={x,y}},
 u(dt){acc+=dt;if(acc<.11)return;acc=0;d=nd;const h={x:s[0].x+d.x,y:s[0].y+d.y};
  if(h.x<0||h.y<0||h.x>=cols||h.y>=rows||s.some(p=>p.x===h.x&&p.y===h.y)){o.dead=true;return}
  s.unshift(h);if(h.x===f.x&&h.y===f.y){o.score+=10;nf()}else s.pop()},
 d(){c.fillStyle='#0b1f3a';c.fillRect(0,0,W,H);
  c.fillStyle='#ffb900';c.fillRect(f.x*cs+2,f.y*cs+4,16,12);c.fillRect(f.x*cs+2,f.y*cs+2,7,3);
  s.forEach((p,i)=>{c.fillStyle=i?'#00b4ff':'#fff';c.fillRect(p.x*cs+1,p.y*cs+1,cs-2,cs-2)})}};
 return o}

function Ping(){let py=145,ay=145,bx=320,by=180,vx=-300,vy=120;
 const o={score:0,dead:false,mv(x,y){py=y-35},dir(x,y){py+=y*40},
 u(dt){py=Math.max(0,Math.min(290,py));ay=Math.max(0,Math.min(290,ay+Math.max(-230*dt,Math.min(230*dt,by-35-ay))));
  bx+=vx*dt;by+=vy*dt;if(by<7||by>353){vy=-vy;by=by<7?7:353}
  if(vx<0&&bx<37&&bx>20&&by>py-4&&by<py+74){vx=-vx*1.06;vy=Math.max(-420,Math.min(420,vy+(by-py-35)*4));o.score++;bx=37}
  if(vx>0&&bx>603&&bx<620&&by>ay-4&&by<ay+74){vx=-vx;vy=Math.max(-420,Math.min(420,vy+(by-ay-35)*3));bx=603}
